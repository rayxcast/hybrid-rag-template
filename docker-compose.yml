services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: qdrant
    expose:
      - "6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # networks: [rag-net]

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # networks: [rag-net]

  reranker_service:
    build: ./services/reranker_service
    container_name: reranker
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8001 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # networks: [rag-net]

  app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      reranker_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status/', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    # networks: [rag-net]

  eval:
    build: .
    container_name: rag-eval
    profiles: ["dev", "eval"]  # only run with docker compose --profile eval up
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      reranker_service:
        condition: service_healthy
    volumes:
      - .:/app
      - ./eval_results:/app/eval_results
    command: ["python", "-m", "app.evaluation.run_eval"]
    restart: no   # if it's a one-shot eval job

volumes:
  qdrant_data:
  redis_data:
